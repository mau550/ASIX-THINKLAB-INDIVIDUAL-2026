#!/usr/sbin/nft -f
# /etc/nftables.conf — r-nftables (router y cortafuegos de la LAN 192.168.29.0/24)
flush ruleset

define WAN = "enp0s3"
define LAN = "enp0s8"
define RED_LAN = 192.168.29.0/24

table inet filtro {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        ip protocol icmp accept
        iifname $LAN udp dport { 53, 67 } accept comment "DNS y DHCP para la LAN"
        iifname $LAN tcp dport { 22, 53 } accept comment "SSH y DNS desde la LAN"
        iifname $WAN tcp dport 22 accept comment "SSH de administración (reenvío de puerto de VirtualBox)"
        log prefix "ENTRADA-DENEGADA " level info
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        iifname $LAN oifname $WAN ip protocol icmp accept comment "ping y traceroute"
        iifname $LAN oifname $WAN udp dport 33434-33534 accept comment "traceroute UDP"
        iifname $LAN oifname $WAN tcp dport 443 log prefix "PERMITIDO-HTTPS " level info accept
        iifname $LAN oifname $WAN tcp dport 80 log prefix "BLOQUEO-HTTP " level info drop
        iifname $LAN oifname $WAN udp dport 53 log prefix "BLOQUEO-DNS-EXTERNO " level info drop
        log prefix "FORWARD-DENEGADO " level info
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip saddr $RED_LAN oifname $WAN masquerade comment "NAT de salida de la LAN"
    }
}
