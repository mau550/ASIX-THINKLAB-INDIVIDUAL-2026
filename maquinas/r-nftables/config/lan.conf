# /etc/dnsmasq.d/lan.conf — DHCP y DNS solo para la LAN
interface=enp0s8
bind-interfaces
domain=iso29.lan
local=/iso29.lan/
dhcp-range=192.168.29.100,192.168.29.200,255.255.255.0,8h
dhcp-option=option:router,192.168.29.1
dhcp-option=option:dns-server,192.168.29.1
# servidores con IP fija (documentados en tareas/T4)
address=/srv-linux.iso29.lan/192.168.29.14
address=/nas-truenas.iso29.lan/192.168.29.10
log-dhcp
